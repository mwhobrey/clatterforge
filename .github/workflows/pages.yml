name: Pages

# Publishes site/ to GitHub Pages. Enable Pages with "GitHub Actions" as the source first.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  # The download links name the latest published release, so republish when one is published.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A release event would check out its tag; always build the current site from the
          # default branch so a newer site change is never replaced by an older tagged copy.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # The source never names the owner or a version: links are filled in from this repository
      # and its latest published release, so download links always point at files that exist.
      - name: Fill in repository links and the release version
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          version=${tag#v}
          case $version in
            ''|*[!0-9.]*) echo "unexpected latest release tag: '$tag'" >&2; exit 1 ;;
          esac
          mkdir _site
          cp -r site/. _site/
          sed -i -e "s#{{REPO}}#${REPO_URL}#g" -e "s#{{VERSION}}#${version}#g" _site/*.html
          if grep -rq '{{' _site --include='*.html'; then echo "unfilled placeholder" >&2; exit 1; fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
