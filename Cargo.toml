[workspace]
members = ["protocol", "edge"]
resolver = "2"

[package]
name = "clatterforge"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1"
axum = "0.8.9"
clap = { version = "4", features = ["derive"] }
clatterforge-protocol = { path = "protocol" }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }
schemars = { version = "1.2.3", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "io-std", "io-util"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_System_Com", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rmcp = { version = "3", features = ["client"] }
tempfile = "3"
tiny_http = "0.12"
tokio = { version = "1", features = ["process"] }

[profile.dev.package.sha2]
opt-level = 3
